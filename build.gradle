plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.skambet'
version = '0.0.1-SNAPSHOT'
description = 'Skam Bet - bookmaker web application'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    cucumberVersion = '7.20.1'
    // newer versions than spring boot 3.4 brings, older testcontainers can't talk to docker engine 29
    set('selenium.version', '4.27.0')
    set('testcontainers.version', '1.21.4')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation platform("io.cucumber:cucumber-bom:${cucumberVersion}")
    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-spring'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation 'org.seleniumhq.selenium:selenium-java'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// only the executable jar is needed (used in Dockerfile)
tasks.named('jar') {
    enabled = false
}

tasks.named('bootJar') {
    archiveFileName = 'skam-bet.jar'
}

tasks.named('test') {
    useJUnitPlatform()

    // gradle -Dheadless=true test -> pass the option to the test jvm
    ['headless', 'browser', 'step.delay', 'cucumber.filter.tags'].each { name ->
        def value = System.getProperty(name)
        if (value != null) {
            systemProperty name, value
        }
    }

    // ui tests depend on the browser and the db, always run them again
    outputs.upToDateWhen { false }

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}
