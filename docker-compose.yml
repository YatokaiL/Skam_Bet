services:
  db:
    image: postgres:16-alpine
    container_name: skambet-db
    environment:
      POSTGRES_DB: skambet
      POSTGRES_USER: skambet
      POSTGRES_PASSWORD: skambet
    ports:
      # 5433 on the host, so it doesn't clash with a locally installed postgres
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U skambet -d skambet" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: skambet-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/skambet
      DB_USER: skambet
      DB_PASSWORD: skambet
      TZ: Europe/Moscow
    ports:
      - "8080:8080"

volumes:
  pgdata:
