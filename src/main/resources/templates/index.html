<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Линия')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container page">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <h1>Линия</h1>

    <form th:action="@{/}" method="get" class="search-form" id="search-form">
        <input type="hidden" name="sport" th:if="${selectedSport != null}" th:value="${selectedSport}">
        <input type="hidden" name="favorites" th:if="${favoritesOnly}" value="true">
        <input type="text" name="q" id="search-input" th:value="${query}" maxlength="50" autocomplete="off"
               placeholder="Поиск по названию команды">
        <button type="submit" class="btn btn-primary" id="search-btn">Найти</button>
        <a th:if="${query != null}" class="btn btn-outline" id="search-reset"
           th:href="${favoritesOnly} ? @{/(favorites=true)} : (${selectedSport == null} ? @{/} : @{/(sport=${selectedSport})})">Сбросить</a>
    </form>
    <div class="field-error search-error" id="search-error" th:if="${searchError}" th:text="${searchError}"></div>

    <!-- the chosen sport and the search query are kept when switching between them -->
    <div class="sport-tabs" id="sport-tabs">
        <a th:href="${appliedQuery == null} ? @{/} : @{/(q=${appliedQuery})}" id="sport-ALL" class="tab"
           th:classappend="${selectedSport == null and !favoritesOnly} ? 'active'">Все</a>
        <a th:if="${currentUser != null}" th:href="@{/(favorites=true)}" id="sport-FAVORITES"
           class="tab tab--favorites" th:classappend="${favoritesOnly} ? 'active'">Избранное</a>
        <a th:each="s : ${sports}" th:id="'sport-' + ${s}" class="tab"
           th:href="${appliedQuery == null} ? @{/(sport=${s})} : @{/(sport=${s},q=${appliedQuery})}"
           th:classappend="${selectedSport == s} ? 'active'" th:text="${s.title}">Футбол</a>
    </div>

    <div th:if="${#lists.isEmpty(events)}" class="empty-state" id="no-events"
         th:text="${favoritesOnly} ? 'В избранном пока нет событий'
                  : (${appliedQuery != null} ? |По запросу «${appliedQuery}» ничего не найдено|
                  : (${selectedSport == null} ? 'В линии пока нет событий' : 'Нет доступных событий по выбранному виду спорта'))">
        Нет событий
    </div>

    <table class="table events" id="events-table" th:unless="${#lists.isEmpty(events)}">
        <thead>
        <tr>
            <th>Начало</th>
            <th>Вид спорта</th>
            <th>Событие</th>
            <th class="col-odd">П1</th>
            <th class="col-odd">X</th>
            <th class="col-odd">П2</th>
            <th class="col-fav" th:if="${currentUser != null}"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${events}" class="event-row" th:attr="data-event-id=${e.id}">
            <td class="event-time" th:text="${#temporals.format(e.startTime, 'dd.MM HH:mm')}">01.10 19:00</td>
            <td class="event-sport" th:text="${e.sport.title}">Футбол</td>
            <td class="event-title" th:text="${e.title}">Спартак — ЦСКА</td>
            <td class="col-odd">
                <a class="odd" data-outcome="HOME" th:href="@{/bets/new(eventId=${e.id},outcome='HOME')}"
                   th:text="${@fmt.odds(e.oddsHome)}">2.10</a>
            </td>
            <td class="col-odd">
                <a th:if="${e.oddsDraw != null}" class="odd" data-outcome="DRAW"
                   th:href="@{/bets/new(eventId=${e.id},outcome='DRAW')}"
                   th:text="${@fmt.odds(e.oddsDraw)}">3.40</a>
                <span th:if="${e.oddsDraw == null}" class="odd odd--disabled" data-outcome="DRAW">—</span>
            </td>
            <td class="col-odd">
                <a class="odd" data-outcome="AWAY" th:href="@{/bets/new(eventId=${e.id},outcome='AWAY')}"
                   th:text="${@fmt.odds(e.oddsAway)}">3.20</a>
            </td>
            <td class="col-fav" th:if="${currentUser != null}">
                <form th:action="@{/favorites/{id}(id=${e.id})}" method="post" class="inline-form">
                    <input type="hidden" name="sport" th:if="${selectedSport != null}" th:value="${selectedSport}">
                    <input type="hidden" name="q" th:if="${appliedQuery != null}" th:value="${appliedQuery}">
                    <input type="hidden" name="favorites" th:if="${favoritesOnly}" value="true">
                    <button type="submit" class="fav-btn"
                            th:classappend="${favoriteIds.contains(e.id)} ? 'fav-btn--active'"
                            th:attr="data-favorite=${favoriteIds.contains(e.id)}"
                            th:title="${favoriteIds.contains(e.id)} ? 'Убрать из избранного' : 'Добавить в избранное'"
                            th:text="${favoriteIds.contains(e.id)} ? '★' : '☆'">☆</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
