spring.application.name=skam-bet
server.port=8080

# postgres from docker-compose.yml by default, can be overridden with env variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/skambet}
spring.datasource.username=${DB_USER:skambet}
spring.datasource.password=${DB_PASSWORD:skambet}

# schema is created by flyway (db/migration), hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.thymeleaf.cache=false

# demo user and events on startup
app.demo-data=${DEMO_DATA:true}
