serenity {
  project.name = "Skam Bet"
  # report: build/serenity/index.html (gradlew test builds it, see build.gradle)
  outputDirectory = build/serenity
  take.screenshots = AFTER_EACH_STEP
  restart.browser.for.each = scenario
  logging = QUIET
}

# the browser is created by our DriverFactory, see SkamBetDriverSource
webdriver {
  driver = provided
  provided {
    type = skambet
    skambet = ru.skambet.bdd.support.SkamBetDriverSource
  }
}
